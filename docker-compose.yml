# SerenityAI - Docker Compose Configuration
# Complete local development environment

version: '3.8'

services:
  # PostgreSQL Database - Conversation logging and training data
  postgres:
    image: postgres:15-alpine
    container_name: serenity-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: serenity_dev_password
      POSTGRES_DB: serenityai
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serenity-network

  # Redis Cache - Subscriptions, caching, rate limiting
  redis:
    image: redis:7-alpine
    container_name: serenity-redis
    command: redis-server --appendonly yes --requirepass serenity_redis_password
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "serenity_redis_password", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - serenity-network

  # SerenityAI Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: serenity-app
    ports:
      - "8000:8000"
    environment:
      # Database
      DATABASE_URL: postgresql://postgres:serenity_dev_password@postgres:5432/serenityai

      # Redis
      REDIS_URL: redis://:serenity_redis_password@redis:6379

      # Environment
      ENV: development
      LOG_LEVEL: INFO

      # API Keys (replace with your actual keys or use .env file)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY}
      DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER}
      TWILIO_PAY_CONNECTOR_NAME: ${TWILIO_PAY_CONNECTOR_NAME}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_PUBLIC_KEY: ${STRIPE_PUBLIC_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      NEWS_API_KEY: ${NEWS_API_KEY}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      BRAVE_API_KEY: ${BRAVE_API_KEY}

      # Google Cloud (for TTS)
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS}

      # Pricing
      PRICE_PER_HOUR: 6.00
      FREE_TRIAL_MINUTES: 5
      PAYMENT_PROMPT_AT_MINUTES: 4
      CURRENCY: GBP

      # Public URL for webhooks
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}

      # Rate limiting
      RATE_LIMIT_ENABLED: true
      MAX_REQUESTS_PER_MINUTE: 30
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Mount source code for development hot-reload
      - ./:/app
      # Mount Google credentials if using local file
      - ${GOOGLE_APPLICATION_CREDENTIALS:-/tmp/placeholder}:/app/google-credentials.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - serenity-network
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: serenity-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@serenityai.local
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - serenity-network
    profiles:
      - tools  # Only starts with --profile tools

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: serenity-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379:0:serenity_redis_password
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - serenity-network
    profiles:
      - tools  # Only starts with --profile tools

networks:
  serenity-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local
